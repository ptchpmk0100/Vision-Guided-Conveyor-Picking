name: ci

# Runs the offline test suite (unit and contract tests + py_compile) in a ROS 2 Jazzy container.
# The scored pick-and-sort checks need a running Gazebo simulator and are not run in CI; they
# run locally via tools/run_parcel_cell_check.sh and tools/condition_arm_check.sh.
on:
  push:
  pull_request:

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    container:
      image: ros:jazzy
      # The runner's default container DNS intermittently fails to resolve the Ubuntu mirrors.
      options: --dns 1.1.1.1 --dns 8.8.8.8
    steps:
      - uses: actions/checkout@v4
      - name: Install python deps
        run: |
          printf 'Acquire::Retries "5";\nAcquire::http::Timeout "20";\n' > /etc/apt/apt.conf.d/99-ci
          apt-get update
          # The parcel-cell tests import MoveIt and the control/vision message packages
          # (no simulator is started; only the Python modules are needed).
          apt-get install -y --no-install-recommends python3-numpy python3-opencv python3-yaml \
            build-essential cmake python3-colcon-common-extensions \
            ros-jazzy-moveit-py ros-jazzy-moveit-configs-utils ros-jazzy-moveit-msgs \
            ros-jazzy-vision-msgs ros-jazzy-control-msgs ros-jazzy-trajectory-msgs \
            ros-jazzy-shape-msgs ros-jazzy-sensor-msgs ros-jazzy-geometry-msgs \
            ros-jazzy-rosgraph-msgs ros-jazzy-std-msgs
      - name: Offline test suite
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          # twin_description and twin_moveit_config are data-only packages; the MoveIt
          # config tests look them up in the ROS package index, so build just those two.
          colcon build --packages-select twin_description twin_moveit_config
          source install/setup.bash
          chmod +x tools/run_offline_tests.sh
          tools/run_offline_tests.sh
