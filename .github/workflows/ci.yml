name: ci

# Runs the offline test suite (unit and contract tests + py_compile) in a ROS 2 Jazzy container.
# The scored pick-and-sort checks need a running Gazebo simulator and are not run in CI; they
# run locally via tools/run_parcel_cell_check.sh and tools/condition_arm_check.sh.
on:
  push:
  pull_request:

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    container:
      image: ros:jazzy
      # The runner's default container DNS intermittently fails to resolve the Ubuntu mirrors.
      options: --dns 1.1.1.1 --dns 8.8.8.8
    steps:
      - uses: actions/checkout@v4
      - name: Install python deps
        run: |
          printf 'Acquire::Retries "5";\nAcquire::http::Timeout "20";\n' > /etc/apt/apt.conf.d/99-ci
          apt-get update
          # The parcel-cell tests import MoveIt and the control/vision message packages
          # (no simulator is started; only the Python modules are needed).
          apt-get install -y --no-install-recommends python3-numpy python3-opencv python3-yaml \
            build-essential cmake python3-colcon-common-extensions \
            ros-jazzy-moveit-py ros-jazzy-moveit-configs-utils ros-jazzy-moveit-msgs \
            ros-jazzy-vision-msgs ros-jazzy-control-msgs ros-jazzy-trajectory-msgs \
            ros-jazzy-shape-msgs ros-jazzy-sensor-msgs ros-jazzy-geometry-msgs \
            ros-jazzy-rosgraph-msgs ros-jazzy-std-msgs
      - name: Offline test suite
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          # twin_description and twin_moveit_config are data-only packages; the MoveIt
          # config tests look them up in the ROS package index, so build just those two.
          colcon build --packages-select twin_description twin_moveit_config
          source install/setup.bash
          chmod +x tools/run_offline_tests.sh
          tools/run_offline_tests.sh

  # C++ port of the parcel condition node: builds it against ONNX Runtime 1.31.1 and runs its gtests against
  # golden data produced by the Python pipeline, using the released model. Both downloads are checked by sha256.
  condition-cpp:
    runs-on: ubuntu-latest
    container:
      image: ros:jazzy
      options: --dns 1.1.1.1 --dns 8.8.8.8
    env:
      ORT_VERSION: 1.31.1
      ORT_SHA256: c849e36a1ef3e22d4ff217b9d1ce4a3cf5b9467b975610913ae959ad5b16bdc9
      MODEL_URL: https://github.com/ptchpmk0100/Vision-Guided-Conveyor-Picking/releases/download/v1.0/condition-model-r1.onnx
      MODEL_SHA256: f94d9d357945fca7be6b71e767fee6f1ad92e7e42d7a3c360d49ac4c81892405
    steps:
      - uses: actions/checkout@v4
      - name: Install build deps
        run: |
          printf 'Acquire::Retries "5";\nAcquire::http::Timeout "20";\n' > /etc/apt/apt.conf.d/99-ci
          apt-get update
          apt-get install -y --no-install-recommends curl ca-certificates build-essential cmake \
            python3-colcon-common-extensions libopencv-dev libyaml-cpp-dev rapidjson-dev \
            ros-jazzy-vision-msgs ros-jazzy-sensor-msgs ros-jazzy-ament-cmake-gtest
      - name: Download ONNX Runtime and model (sha256 checked)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /opt/dl && cd /opt/dl
          curl -sSfL -o ort.tgz "https://github.com/microsoft/onnxruntime/releases/download/v${ORT_VERSION}/onnxruntime-linux-x64-${ORT_VERSION}.tgz"
          echo "${ORT_SHA256}  ort.tgz" | sha256sum -c -
          tar -xzf ort.tgz
          curl -sSfL -o model.onnx "$MODEL_URL"
          echo "${MODEL_SHA256}  model.onnx" | sha256sum -c -
          echo "ONNXRUNTIME_ROOT=/opt/dl/onnxruntime-linux-x64-${ORT_VERSION}" >> "$GITHUB_ENV"
          echo "CONDITION_MODEL=/opt/dl/model.onnx" >> "$GITHUB_ENV"
      - name: Build and test twin_condition_cpp
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon build --base-paths src --packages-select twin_condition_cpp
          colcon test --base-paths src --packages-select twin_condition_cpp --event-handlers console_direct+
          colcon test-result --verbose
          # the classifier tests skip without a model; in CI a skip means the model step broke, so fail loudly
          if grep -rl 'result="skipped"' build/twin_condition_cpp/test_results; then echo "tests were skipped"; exit 1; fi
