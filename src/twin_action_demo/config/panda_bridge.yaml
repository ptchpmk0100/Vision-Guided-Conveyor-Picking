# ============================================================
# S20 PERCEPTION: append these entries to panda_bridge.yaml
# (the gz -> ROS feedback direction, same as the joint_state entry).
# The rgbd_camera sensor publishes four gz topics under /overhead_camera;
# we only need the depth image + camera_info to deproject a pixel to a
# 3D point. (RGB is bridged too so you can eyeball it in rqt / rviz.)
# ============================================================

# --- Depth image: gz.msgs.Image -> sensor_msgs/Image (32FC1 depth) ---
- ros_topic_name: "/overhead_camera/depth_image"
  gz_topic_name: "/overhead_camera/depth_image"
  ros_type_name: "sensor_msgs/msg/Image"
  gz_type_name: "gz.msgs.Image"
  direction: GZ_TO_ROS

# --- Camera intrinsics: needed to turn (u,v,depth) into (x,y,z) ---
- ros_topic_name: "/overhead_camera/camera_info"
  gz_topic_name: "/overhead_camera/camera_info"
  ros_type_name: "sensor_msgs/msg/CameraInfo"
  gz_type_name: "gz.msgs.CameraInfo"
  direction: GZ_TO_ROS

# --- RGB image: for color segmentation (find the blue cube) ---
- ros_topic_name: "/overhead_camera/image"
  gz_topic_name: "/overhead_camera/image"
  ros_type_name: "sensor_msgs/msg/Image"
  gz_type_name: "gz.msgs.Image"
  direction: GZ_TO_ROS
# NOTE: the rgbd_camera also emits /overhead_camera/points (a PointCloud2).
# Bridging that is an ALTERNATIVE to depth+info deprojection -- if you'd
# rather segment in cloud space later, add:
# - ros_topic_name: "/overhead_camera/points"
#   gz_topic_name: "/overhead_camera/points"
#   ros_type_name: "sensor_msgs/msg/PointCloud2"
#   gz_type_name: "gz.msgs.PointCloudPacked"
#   direction: GZ_TO_ROS
