# ---- FEEDBACK: gz -> ROS (the '[' direction) ----
- ros_topic_name: "/world/empty/model/panda/joint_state"
  gz_topic_name: "/world/empty/model/panda/joint_state"
  ros_type_name: "sensor_msgs/msg/JointState"
  gz_type_name: "gz.msgs.Model"
  direction: GZ_TO_ROS

