controller_manager:
  ros__parameters:
    use_sim_time: true # Use Gazebo's clock for ROS time
    update_rate: 1000 # Hz — the manager's control-loop rate

    # --- registry: name -> type. Naming here does NOT start them. ---
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    # --- Finger controller: JointTrajectoryController over BOTH finger joints.
    # Was position_controllers/GripperActionController (single joint + mimic), but
    # DART can't enforce the mimic, so the second finger was uncoupled. JTC drives
    # both fingers together as commanded joints -> symmetric close, no friction
    # chatter. Trade-off: JTC has no stall signal, so move_gripper now infers the
    # grasp from finger width vs commanded (see move_to.py). ---
    gripper_controller:
      type: joint_trajectory_controller/JointTrajectoryController

# --- per-controller config, keyed by the names above ---
arm_controller:
  ros__parameters:
    joints:
      - panda_joint1
      - panda_joint2
      - panda_joint3
      - panda_joint4
      - panda_joint5
      - panda_joint6
      - panda_joint7
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity

# --- Finger controller config: both fingers, position trajectory ---
# panda_finger_joint2 is commanded alongside joint1 (no mimic). MoveIt drives
# this via FollowJointTrajectory now, not GripperCommand -- the MoveIt controllers
# yaml must match (type: FollowJointTrajectory for the gripper).
gripper_controller:
  ros__parameters:
    joints:
      - panda_finger_joint1
      - panda_finger_joint2
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    # Both fingers get the same commanded position each point, so the hand closes
    # symmetrically. allow_stalling/stall_* are gone: JTC has no stall concept;
    # grasp detection moved into move_gripper (finger width vs commanded gap).
